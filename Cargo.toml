[package]
name = "oinkie"
version = "0.4.0"
description = "Birthmarking toolkit for Ghidra P-Code"
edition = "2024"

[features]
gencomp = [ "dep:clap_complete" ]

[dependencies]
chrono = { version = "0.4.44", features = [ "serde" ] }
# "string" lets the builder take runtime-generated values, which is what the
# completion lists for --birthmark-type and --analysis are: they are computed
# from the birthmark vocabulary rather than written out (#25).
clap = { version = "4.6.1", features = [ "derive", "string" ] }
clap_complete = { version = "4.6.5", optional = true }
csv = "1.4.0"
env_logger = "0.11.10"
indicatif = "0.18.4"
itertools = "0.14.0"
katexit = "0.1.5"
lapjv = "0.3.0"
log = "0.4.32"
ndarray = "0.16"
num-derive = "0.4.2"
num-traits = "0.2.19"
rayon = "1.12.0"
rustc-hash = "2.1.2"
serde = { version = "1.0.228", features = [ "derive" ] }
serde_json = "1.0.150"
sha2 = "0.10.9"
tempfile = "3.10.1"
thiserror = "2.0.20"

[[bin]]
name = "oinkie"
path = "cli/main.rs"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
serial_test = "4.0.1"

[[bin]]
name = "gencomp"
path = "cli/gencomp.rs"
required-features = [ "gencomp" ]
