# External links rot on their own schedule, and checking them on a push would
# fail a build because someone else's site was down for ten minutes. So they are
# checked weekly, and a failure opens an issue rather than turning `main` red.
#
# Internal links are not checked here. They are checked on every push by
# .github/scripts/check_links.py, which needs no network and cannot be flaky.
name: link rot

on:
  schedule:
    # Mondays, early. Nothing depends on the hour.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  external-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Markdown only, and only what is outside this repository: the rest is
      # already checked on every push. target/ is not in a fresh checkout, but
      # holds old copies of the README in a working tree that has packaged one.
      #
      # --root-dir: the site's pages link to each other root-relatively
      # (`/install`), which Hugo rewrites under the base URL when it builds.
      # Without a root lychee cannot resolve them and reports each as an
      # error; with one they resolve to local files, which the two --scheme
      # options then leave out, as intended.
      #
      # --exclude: hosts that answer a link checker with 403 whatever the
      # link, so a rotted link there is indistinguishable from a live one and
      # every run would report all of them. dl.acm.org links are DOIs, which
      # do not rot the way a conference site does. Nothing links to
      # academia.edu or ResearchGate, which answer the same way: CiNii, a DOI
      # or arXiv instead.
      - name: Check external links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude-path docs/public
            --exclude-path target
            --root-dir ${{ github.workspace }}/docs/content
            --scheme https
            --scheme http
            --exclude '^https://dl\.acm\.org/'
            --exclude '^https://coveralls\.io/'
            --max-retries 3
            './**/*.md'
          fail: false

      # Without this the job opens a new issue every Monday for as long as a
      # link stays broken, so a site that goes away for a month leaves four
      # issues saying the same thing. Finding the open one first turns the
      # weekly run into an update.
      - name: Find the open link-rot issue, if there is one
        id: existing
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Matched exactly rather than by label, so that this needs no repository
          # metadata to exist before the first run. It has to stay the same as the
          # title below.
          TITLE: External links have rotted
        run: |
          number=$(gh issue list \
            --state open \
            --search "$TITLE in:title" \
            --limit 1 \
            --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          echo "number=$number" >> "$GITHUB_OUTPUT"
          if [ -n "$number" ]; then
            echo "updating #$number"
          else
            echo "none open; a new one will be created"
          fi

      - name: Say what rotted
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: External links have rotted
          content-filepath: ./lychee/out.md
          labels: documentation
          # Empty when none is open, which is what makes this create one.
          issue-number: ${{ steps.existing.outputs.number }}
