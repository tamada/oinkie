# SonarQube Cloud analysis (#159), run by .github/workflows/sonar-qube.yaml.
#
# Kept here rather than in the workflow's arguments or the server's settings,
# so that what is analysed, and what is not, is in the diff a reviewer reads.

sonar.organization=tamada
sonar.projectKey=tamada_oinkie
sonar.projectName=oinkie
sonar.sourceEncoding=UTF-8

# The library, the command line, the lifting scripts and the CI helpers. Unit
# tests inside src/ and cli/ are `#[cfg(test)]` modules of the files they
# test, so they are analysed as part of the sources; tests/ holds the
# integration tests.
sonar.sources=src,cli,assets/lifters,.github/scripts
sonar.tests=tests

# Java needs its compiled classes, given through sonar.java.binaries, or the
# analysis refuses to run; the Ghidra lifting script compiles only against
# Ghidra's jars. It is left out until that is wired up -- its string handling
# is tested by compile-check.sh --run in build.yaml (#138).
sonar.exclusions=**/*.java

# Produced by the workflow before the scan. The coverage is the run Coveralls
# reports, `cargo llvm-cov --features mcp`, so the two agree; clippy is run
# with the same features as build.yaml's.
sonar.rust.lcov.reportPaths=coverage.lcov
sonar.rust.clippyReport.reportPaths=clippy-report.json
