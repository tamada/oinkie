name: Copilot Setup Steps

on:
  workflow_dispatch: {}

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Setup java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "25.0.2"

      - name: Setup ghidra
        uses: antoniovazquezblanco/setup-ghidra@v2
        with:
          version: "12.1"
          auth_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Check
        run: |
          echo "Copilot setup steps completed."
