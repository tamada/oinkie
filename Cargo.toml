[package]
name = "oinkie"
version = "0.8.0"
description = "Detects software theft by comparing birthmarks extracted from binaries"
edition = "2024"
# The oldest Rust that builds what a user installs: the library, and the
# command with or without `mcp`. Cargo resolves dependencies to versions that
# build on it, and tells a user with an older Rust so rather than failing in
# the compiler. Checked with that toolchain; the test-only dependencies may
# need a newer one.
rust-version = "1.88"
# crates.io refuses an upload without a licence.
license = "MIT"
repository = "https://github.com/tamada/oinkie"
homepage = "https://tamada.github.io/oinkie"
readme = "README.md"
keywords = [ "birthmark", "plagiarism", "reverse-engineering", "ghidra", "binary" ]
# From crates.io's fixed list; anything else is rejected at upload.
categories = [ "command-line-utilities", "development-tools" ]
# What a published crate has no use for. Written as exclusions rather than as
# an `include` whitelist so that a file added beside the lifting scripts is
# published by default: `src/ghidra/lifter.rs` compiles one in with
# `include_str!`, and a whitelist that forgot the next one would build here and
# fail for whoever ran `cargo add`.
exclude = [
    "/.github",
    "/docs",
    "/testdata",
    "/Containerfile",
    "/HANDOVER.md",
]

[features]
default = [ "cli" ]
# What the `oinkie` binary needs and the library does not. Measured rather than
# assumed: nothing under `src/` mentions clap, sha2, env_logger or indicatif --
# argument parsing, the output file naming, logging and progress live in
# `cli/`, which owns them.
#
# The library does not know the command line. `cargo tree --no-default-features
# -e normal` therefore lists none of these, nor rmcp, tokio or clap_complete,
# and that is checked rather than hoped for.
#
# On by default, so `cargo install oinkie` and every build here are unchanged.
# `cargo add oinkie --no-default-features` is what it buys: a library that does
# not drag in an argument parser, a logger and a progress bar to read a JSON
# file.
cli = [ "dep:clap", "dep:sha2", "dep:env_logger", "dep:indicatif" ]
# Both of these are built into the command line, so both need what it needs.
gencomp = [ "cli", "dep:clap_complete" ]
# The MCP server. Behind a feature the way `gencomp` is, so that a build that
# does not want it does not carry tokio and rmcp; the release workflows pass
# `--features mcp`, so the published binary has it.
mcp = [ "cli", "dep:rmcp", "dep:tokio" ]

[dependencies]
chrono = { version = "0.4.44", features = [ "serde" ] }
# "string" lets the builder take runtime-generated values, which is what the
# completion lists for --birthmark-type and --analysis are: they are computed
# from the birthmark vocabulary rather than written out.
clap = { version = "4.6.1", optional = true, features = [ "derive", "string", "wrap_help" ] }
clap_complete = { version = "4.6.5", optional = true }
csv = "1.4.0"
env_logger = { version = "0.11.10", optional = true }
indicatif = { version = "0.18.4", optional = true }
itertools = "0.15.0"
katexit = "0.1.5"
log = "0.4.32"
num-derive = "0.5.1"
num-traits = "0.2.19"
# The library's own: a pair's matrix is filled by rows in parallel. Its pool
# starts only when a comparison first uses it, and a caller who wants to bound
# it compares inside a `ThreadPool::install` of its own.
rayon = "1.12.0"
# `schemars` is not a direct dependency: rmcp re-exports the version its macros
# generate against, and depending on a second one is how the derives stop
# agreeing with the runtime.
rmcp = { version = "3.2", optional = true, features = [ "macros", "server", "transport-io" ] }
rustc-hash = "2.1.2"
serde = { version = "1.0.228", features = [ "derive" ] }
serde_json = "1.0.150"
sha2 = { version = "0.11.0", optional = true }
tempfile = "3.10.1"
thiserror = "2.0.20"
tokio = { version = "1.53", optional = true, features = [ "rt-multi-thread", "macros", "io-std" ] }

[[bin]]
name = "oinkie"
path = "cli/main.rs"
# The binary is the CLI, so it cannot be built without what the CLI needs. With
# `default = ["cli"]` this only takes effect for `--no-default-features`, where
# it turns a wall of missing-crate errors into cargo saying the feature is off.
required-features = [ "cli" ]

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
serial_test = "4.0.1"

[[bin]]
name = "gencomp"
path = "cli/gencomp.rs"
required-features = [ "gencomp" ]

# Two pedantic lints, on because SonarQube Cloud reports what they find: a
# closure that only calls a method, and an `else` after a branch that leaves.
# CI runs clippy with -D warnings, so they are caught before SonarQube sees
# them.
[lints.clippy]
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
