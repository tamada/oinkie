[package]
name = "oinkie2"
version = "0.1.0"
description = "Birthmarking toolkit for Ghidra P-Code"
edition = "2024"

[dependencies]
clap = { version = "4.5.60", features = [ "derive" ] }
env_logger = "0.11.9"
indicatif = "0.18.4"
itertools = "0.14.0"
katexit = "0.1.5"
log = "0.4.29"
num-derive = "0.4.2"
num-traits = "0.2.19"
pathfinding = "4.14.0"
rayon = "1.11.0"
rustc-hash = "2.1.1"
serde = { version = "1.0.228", features = [ "derive" ] }
serde_json = "1.0.149"

[[bin]]
name = "oinkie2"
path = "cli/main.rs"
