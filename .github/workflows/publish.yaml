name: publish
on:
  pull_request:
    branches:
      - main
    types: [closed]

jobs:
  # Tags main and opens a draft release. The version is read from the head
  # branch (releases/vX.Y.Z), and comes back in two forms:
  #   outputs.version  0.3.0   for naming artefacts
  #   outputs.tag      v0.3.0  for addressing the release
  start:
    if: startsWith(github.head_ref, 'releases/v') && github.event.pull_request.merged == true
    uses: tamada/.github/.github/workflows/release-start.yaml@v1
    permissions:
      contents: write

  # Prepends the hand-written upgrade note for this version to the draft that
  # release-start opened. The note lives in the repository so that whoever
  # makes a breaking change writes it while they still have the context,
  # rather than someone reconstructing it at release time (#31).
  #
  # A missing file is a hard failure on purpose: release-start has already
  # tagged and drafted by this point, so a silent skip is exactly the
  # "nobody remembered" outcome this is meant to prevent.
  release-notes:
    runs-on: ubuntu-latest
    needs: start
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Prepend the upgrade note to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.start.outputs.tag }}
          VERSION: ${{ needs.start.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          notes=".github/release-notes/v${VERSION}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::$notes not found. Every release needs an upgrade note; add the file and re-run this job."
            exit 1
          fi

          # release-start already drafted the release with --generate-notes, so
          # the body holds the generated pull request list. Put the hand-written
          # note above it rather than regenerating, so what ships is exactly
          # what was reviewed.
          gh release view "$TAG" --repo "$REPO" --json body --jq '.body' > generated.md
          { cat "$notes"; echo; cat generated.md; } > notes.md
          gh release edit "$TAG" --repo "$REPO" --notes-file notes.md
          echo "release notes for $TAG taken from $notes" >> "$GITHUB_STEP_SUMMARY"

  publish:
    runs-on: ${{ matrix.os }}
    needs: start
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            architecture: arm64
            os_name: linux
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            architecture: amd64
            os_name: linux
          - os: macos-latest
            target: aarch64-apple-darwin
            architecture: arm64
            os_name: darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            architecture: amd64
            os_name: darwin
    steps:
      - name: Setup Zig
        uses: mlugg/setup-zig@v2

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: build
        run: |
          rustup update stable
          rustup target add ${{ matrix.target }}
          cargo install cargo-zigbuild
          cargo zigbuild --release --target ${{ matrix.target }}

      - name: Create distribution files.
        env:
          APPNAME: ${{ needs.start.outputs.appname }}
          VERSION: ${{ needs.start.outputs.version }}
          ARCHITECTURE: ${{ matrix.architecture }}
          OS_NAME: ${{ matrix.os_name }}
          TARGET: ${{ matrix.target }}
        run: |
          ASSET_NAME="${APPNAME}-${VERSION}_${ARCHITECTURE}_${OS_NAME}"
          mkdir -p "dist/$ASSET_NAME"
          cp "target/${TARGET}/release/${APPNAME}" "dist/$ASSET_NAME/"
          cp README.md LICENSE "dist/$ASSET_NAME/"
          cp -r assets/completions "dist/$ASSET_NAME/"
          tar cvfz "dist/${ASSET_NAME}.tar.gz" -C dist "$ASSET_NAME"

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          APPNAME: ${{ needs.start.outputs.appname }}
          VERSION: ${{ needs.start.outputs.version }}
          TAG: ${{ needs.start.outputs.tag }}
          ARCHITECTURE: ${{ matrix.architecture }}
          OS_NAME: ${{ matrix.os_name }}
        run: |
          ASSET_NAME="${APPNAME}-${VERSION}_${ARCHITECTURE}_${OS_NAME}"
          gh release upload "$TAG" "dist/${ASSET_NAME}.tar.gz"

  container:
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Setup Just
        uses: extractions/setup-just@v4

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ACCOUNT }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Build Container
        run: |
          just container

  # Takes the draft off. Publishing with the App token (APP_CLIENT_ID /
  # APP_PRIVATE_KEY, carried by `secrets: inherit`) is what makes the
  # `release: published` event fire, so notify-publish actually runs.
  finish:
    needs: [start, container, release-notes]
    uses: tamada/.github/.github/workflows/release-finish.yaml@v1
    with:
      tag: ${{ needs.start.outputs.tag }}
    permissions:
      contents: write
    secrets: inherit
