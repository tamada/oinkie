[package]
name = "oinkie"
version = "0.3.0"
description = "Birthmarking toolkit for Ghidra P-Code"
edition = "2024"

[dependencies]
chrono = { version = "0.4.44", features = [ "serde" ] }
clap = { version = "4.6.1", features = [ "derive" ] }
clap_complete = "4.6.5"
csv = "1.4.0"
env_logger = "0.11.10"
indicatif = "0.18.4"
itertools = "0.14.0"
katexit = "0.1.5"
lapjv = "0.3.0"
log = "0.4.32"
ndarray = "0.16"
num-derive = "0.4.2"
num-traits = "0.2.19"
rayon = "1.12.0"
rustc-hash = "2.1.2"
serde = { version = "1.0.228", features = [ "derive" ] }
serde_json = "1.0.150"
sha2 = "0.10.9"
tempfile = "3.10.1"

[[bin]]
name = "oinkie"
path = "cli/main.rs"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
