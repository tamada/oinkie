# External links rot on their own schedule, and checking them on a push would
# fail a build because someone else's site was down for ten minutes. So they are
# checked weekly, and a failure opens an issue rather than turning `main` red.
#
# Internal links are not checked here. They are checked on every push by
# .github/scripts/check_links.py, which needs no network and cannot be flaky.
name: link rot

on:
  schedule:
    # Mondays, early. Nothing depends on the hour.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  external-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check external links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Markdown only, and only what is outside this repository: the rest
          # is already checked on every push.
          args: >-
            --no-progress
            --exclude-path docs/public
            --scheme https
            --scheme http
            --max-retries 3
            './**/*.md'
          fail: false

      # Without this the job opens a new issue every Monday for as long as a
      # link stays broken, so a site that goes away for a month leaves four
      # issues saying the same thing. Finding the open one first turns the
      # weekly run into an update.
      - name: Find the open link-rot issue, if there is one
        id: existing
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Matched exactly rather than by label, so that this needs no repository
          # metadata to exist before the first run. It has to stay the same as the
          # title below.
          TITLE: External links have rotted
        run: |
          number=$(gh issue list \
            --state open \
            --search "$TITLE in:title" \
            --limit 1 \
            --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          echo "number=$number" >> "$GITHUB_OUTPUT"
          if [ -n "$number" ]; then
            echo "updating #$number"
          else
            echo "none open; a new one will be created"
          fi

      - name: Say what rotted
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: External links have rotted
          content-filepath: ./lychee/out.md
          labels: documentation
          # Empty when none is open, which is what makes this create one.
          issue-number: ${{ steps.existing.outputs.number }}
