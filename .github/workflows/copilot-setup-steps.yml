name: Copilot Setup Steps

on:
  workflow_dispatch: {}

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Setup java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "25.0.2"

      - name: Setup ghidra
        uses: antoniovazquezblanco/setup-ghidra@v2
        with:
          version: "12.1"
          auth_token: ${{ secrets.GITHUB_TOKEN }}

      # The same script build.yaml uses. An official release does not ship a
      # decompiler binary for every platform it supports, and without one for
      # the platform in hand every lift would report success and find no
      # functions. The script builds one and then asserts it
      # exists; it does not look for an existing one first, because a
      # distribution carries other platforms' binaries and finding those
      # proves nothing about this one.
      - name: Make sure Ghidra can decompile
        run: ./.github/scripts/ensure_ghidra_decompiler.sh

      - name: Setup Check
        run: echo "Copilot setup steps completed."
