name: publish
on:
  pull_request:
    branches:
      - main
    types: [closed]

jobs:
  # Tags main and opens a draft release. The version is read from the head
  # branch (releases/vX.Y.Z), and comes back in two forms:
  #   outputs.version  0.3.0   for naming artefacts
  #   outputs.tag      v0.3.0  for addressing the release
  start:
    if: startsWith(github.head_ref, 'releases/v') && github.event.pull_request.merged == true
    uses: tamada/.github/.github/workflows/release-start.yaml@v1
    permissions:
      contents: write

  # Prepends the hand-written upgrade note for this version to the draft that
  # release-start opened. The note lives in the repository so that whoever
  # makes a breaking change writes it while they still have the context,
  # rather than someone reconstructing it at release time.
  #
  # A missing file is a hard failure on purpose: release-start has already
  # tagged and drafted by this point, so a silent skip is exactly the
  # "nobody remembered" outcome this is meant to prevent.
  release-notes:
    runs-on: ubuntu-latest
    needs: start
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Prepend the upgrade note to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.start.outputs.tag }}
          VERSION: ${{ needs.start.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          notes=".github/release-notes/v${VERSION}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::$notes not found. Every release needs an upgrade note; add the file and re-run this job."
            exit 1
          fi

          # release-start already drafted the release with --generate-notes, so
          # the body holds the generated pull request list. Put the hand-written
          # note above it rather than regenerating, so what ships is exactly
          # what was reviewed.
          gh release view "$TAG" --repo "$REPO" --json body --jq '.body' > generated.md
          { cat "$notes"; echo; cat generated.md; } > notes.md
          gh release edit "$TAG" --repo "$REPO" --notes-file notes.md
          echo "release notes for $TAG taken from $notes" >> "$GITHUB_STEP_SUMMARY"

  # The binaries, one per platform, built and uploaded to the draft. How they
  # are built lives in release-binaries.yaml, which pull requests changing it
  # run too, so that it is not first exercised here.
  publish:
    needs: start
    uses: ./.github/workflows/release-binaries.yaml
    with:
      appname: ${{ needs.start.outputs.appname }}
      version: ${{ needs.start.outputs.version }}
      tag: ${{ needs.start.outputs.tag }}
      ref: main
    permissions:
      contents: write

  container:
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Setup Just
        uses: extractions/setup-just@v4

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ACCOUNT }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Build Container
        run: |
          just container

  # Takes the draft off. Publishing with the App token (APP_CLIENT_ID /
  # APP_PRIVATE_KEY, carried by `secrets: inherit`) is what makes the
  # `release: published` event fire, so notify-publish actually runs.
  # Last, and after the binaries and the images, because `cargo publish` is the
  # one step here that cannot be undone: a version can be yanked but never
  # re-uploaded. Anything that was going to fail should have failed already.
  #
  # A release that cannot authenticate fails rather than skipping, because the
  # alternative is a tagged release with no crate and nothing saying so.
  crates-io:
    runs-on: ubuntu-latest
    # release-notes as well as the artefacts. It runs in parallel with them, so
    # without it a broken release note could still be failing while this
    # uploaded -- which is the opposite of what putting this job last is for.
    needs: [publish, container, release-notes]
    permissions:
      # The OIDC token crates.io trades for a publishing one. Nothing else in
      # this workflow needs it, so it is granted here rather than at the top.
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Trusted publishing: crates.io recognises this repository and workflow
      # and issues a token that lives for the length of this job. There is no
      # long-lived secret in the repository to leak, to rotate, or to forget to
      # rotate.
      - name: Get a publishing token from crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # --locked, because the release binaries were built from this
        # Cargo.lock and a crate resolved differently is a different build.
        run: cargo publish --locked

  finish:
    needs: [start, container, release-notes, crates-io]
    uses: tamada/.github/.github/workflows/release-finish.yaml@v1
    with:
      tag: ${{ needs.start.outputs.tag }}
    permissions:
      contents: write
    secrets: inherit
