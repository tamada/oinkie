name: build
on:
  push:
    branches:
      - "**"
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macOS-latest
          # - windows-latest
    steps:
      - name: setup rust
        run: |
          rustup update stable

      - name: checkout
        uses: actions/checkout@v6

      - name: Setup java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "25.0.2"

      - name: Setup ghidra
        uses: antoniovazquezblanco/setup-ghidra@v2
        with:
          version: "12.1"
          auth_token: ${{ secrets.GITHUB_TOKEN }}

      # Ghidra compiles the lifting script at lift time, so an error in it is
      # not a build failure -- it is a lift that produces nothing, reported as
      # a missing output because analyzeHeadless exits 0 either way. The jars
      # and the JDK are already here for the steps above, so checking it costs
      # about two seconds.
      # The shallow half, for the full image, which is not built here.
      - name: Check the Containerfiles' sources exist
        run: ./.github/scripts/check_container_sources.sh

      # Actually build one, rather than checking that its COPY sources exist.
      # A path check would have caught the break that prompted this and very
      # little else: not a COPY that names the wrong thing, not an
      # `include_str!` reaching outside the context, not a runtime stage
      # missing a dependency. Measured at 26s cold locally, so the reason for
      # not doing it was wrong.
      #
      # The light image only, and on one leg of the matrix. It shares its
      # entire builder stage with the full image, so everything about the build
      # context is covered for both; what the full image adds is a 400 MB
      # Ghidra download whose URL and checksum change only when someone edits
      # them, and that is left to the release, with the cheap check above
      # standing in for it here.
      - name: Build the light container image
        if: matrix.os == 'ubuntu-latest'
        run: docker build -f containers/light/Containerfile -t oinkie:ci .

      # The image is only worth building if it runs, and the one thing it must
      # do that the host binary does not is serve MCP over `docker run -i`.
      - name: Verify the image serves MCP
        if: matrix.os == 'ubuntu-latest'
        run: ./.github/scripts/verify_mcp.sh --image oinkie:ci

      - name: Compile the lifting scripts
        run: |
          ./assets/lifters/ghidra/compile-check.sh \
            assets/lifters/ghidra/scripts/HighPCodeLifter.java \
            testdata/scripts/BrokenLifter.java

      - name: build
        run: |
          cargo fmt --all -- --check
          # Both configurations get compiled. The release binary carries the
          # MCP server, so clippy is run with the feature; `cargo build` is
          # left on the default features, because everything under `mcp` is
          # behind `#[cfg]` and a wrong one would otherwise only show up in a
          # build nobody runs.
          cargo clippy --all-targets --features mcp -- -D warnings
          cargo build --release

      - name: Convert coverage format to lcov
        if: matrix.os == 'ubuntu-latest'
        run: |
          export GHIDRA_HOME=${{ env.GHIDRA_INSTALL_DIR }}
          cargo install cargo-llvm-cov
          rustup component add llvm-tools-preview
          # --features mcp, or cli/mcp/ is invisible to the report the way
          # cli/gencomp.rs already is: behind a feature, and so never compiled
          # by a coverage run using the default ones.
          cargo llvm-cov --features mcp --lcov --output-path coverage.lcov

      - name: coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.github_token }}
          path-to-lcov: coverage.lcov
        if: matrix.os == 'ubuntu-latest'
