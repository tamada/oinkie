name: build
on:
  push:
    branches:
      - "**"
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      # One runner failing should not cancel the others. Three platforms are
      # three answers, and hiding two of them because the first came back first
      # is how a Windows job was cancelled twice while the question being asked
      # was whether Windows works.
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
    steps:
      - name: setup rust
        run: |
          rustup update stable

      - name: checkout
        uses: actions/checkout@v6

      - name: Setup java
        if: matrix.os != 'windows-latest'
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "25.0.2"

      # Windows is built without Ghidra. The lifter needs it, but the library,
      # the CLI and the MCP server do not, and what this job is asking of
      # Windows is whether they compile and pass.
      - name: Setup ghidra
        if: matrix.os != 'windows-latest'
        uses: antoniovazquezblanco/setup-ghidra@v2
        with:
          version: "12.1"
          auth_token: ${{ secrets.GITHUB_TOKEN }}
      # An official Ghidra release carries prebuilt native binaries for Windows
      # x86-64, Windows ARM64 and Linux x86-64 -- and for nothing else. macOS,
      # on either architecture, is in the list GettingStarted.md calls "supported
      # with user-built native binaries", so the distribution is complete as
      # published and incomplete for this runner. The action has no say in it:
      # its whole configuration surface is which archive to fetch and how to
      # check it.
      #
      # Without the decompiler binary, `DecompInterface.decompileFunction`
      # fails for every function and HighPCodeLifter.java skips each one, so a
      # lift produces a parseable file with no functions in it -- and
      # analyzeHeadless still exits 0 (#54). That is what failed the macOS job
      # while ubuntu passed on the same bytes (#126), and what #135 is about.
      #
      # The JDK is already here from setup-java, the distribution supplies its
      # own Gradle wrapper, and Xcode Command Line Tools are on the runner
      # image, so this needs nothing added.
      - name: Build Ghidra's native components
        if: matrix.os == 'macOS-latest'
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ env.GHIDRA_INSTALL_DIR }}/support/gradle"
          ./gradlew buildNatives

          # A build that exits 0 without producing the binary would leave the
          # lift silently empty again, which is the whole failure this step
          # exists to end. Ghidra prefers build/os/<platform>/ over the
          # prebuilt os/<platform>/, so look in both rather than assuming
          # which one won.
          cd "${{ env.GHIDRA_INSTALL_DIR }}"
          # `|| true`, because the point of this check is the message below:
          # under `set -e` a failing find would kill the step before it.
          found=$(find Ghidra/Features/Decompiler -type f -name decompile \
                    -path '*os/*' -print 2>/dev/null | sort || true)
          if [ -z "$found" ]; then
            echo "buildNatives exited 0 but no decompiler binary exists:" >&2
            find Ghidra/Features/Decompiler -type d -name 'os' \
              -exec sh -c 'echo "  $1:"; ls -R "$1"' _ {} \; >&2 || true
            exit 1
          fi
          echo "decompiler native binaries:"
          echo "$found" | sed 's/^/  /'

      # Ghidra compiles the lifting script at lift time, so an error in it is
      # not a build failure -- it is a lift that produces nothing, reported as
      # a missing output because analyzeHeadless exits 0 either way. The jars
      # and the JDK are already here for the steps above, so checking it costs
      # about two seconds.
      # Two of the three runtime stages, on one architecture.
      #
      # All three share one builder stage, so building any of them exercises
      # the build context -- the COPY paths, the `include_str!` reaches, the
      # cargo build -- for all of them. What `ghidra-image` adds beyond that is
      # a 400 MB download whose URL and checksum change only when someone edits
      # them; the release builds it, and that is soon enough.
      #
      # `mcp-image` is built here even though it adds no layer to `light-image`,
      # because what it does add is a stage name and a default command, and
      # neither is exercised by building anything else. A typo in either would
      # otherwise surface when a client started the image.
      #
      # Building rather than checking that the COPY sources exist: a path check
      # catches a moved directory and nothing else -- not a COPY naming the
      # wrong thing, not an `include_str!` reaching outside the context, not a
      # runtime stage missing a dependency, not a binary that will not run once
      # it is in there. Cold, with no cache, this takes 26s locally.
      - name: Build the light container image
        if: matrix.os == 'ubuntu-latest'
        run: docker build --target light-image -f Containerfile -t oinkie:ci .

      # The image is only worth building if it runs, and the one thing it must
      # do that the host binary does not is serve MCP over `docker run -i`.
      - name: Verify the image serves MCP
        if: matrix.os == 'ubuntu-latest'
        run: ./.github/scripts/verify_mcp.sh --image oinkie:ci

      - name: Build the mcp container image
        if: matrix.os == 'ubuntu-latest'
        run: docker build --target mcp-image -f Containerfile -t oinkie:ci-mcp .

      # Without --no-args this runs `oinkie mcp --root .`, which the image's own
      # default command already says. Passing it is what tells us the default is
      # right: it is the whole of what this stage adds, and the only place it is
      # read is a client's startup.
      - name: Verify the mcp image needs no arguments
        if: matrix.os == 'ubuntu-latest'
        run: ./.github/scripts/verify_mcp.sh --image oinkie:ci-mcp --no-args

      # No network and no build: it reads the Markdown and looks at the
      # filesystem, so it costs seconds rather than adding to the six minutes
      # this workflow already takes.
      - name: Check the internal links
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 .github/scripts/test_check_links.py
          python3 .github/scripts/check_links.py

      # publish.yaml copies this directory into every release archive, and
      # nothing else looks at it, so a move would be found while cutting a
      # release rather than here.
      - name: Check the completions are where the release expects them
        if: matrix.os == 'ubuntu-latest'
        run: test -d assets/completions

      - name: Compile the lifting scripts
        if: matrix.os != 'windows-latest'
        run: |
          ./assets/lifters/ghidra/compile-check.sh \
            assets/lifters/ghidra/scripts/HighPCodeLifter.java \
            testdata/scripts/BrokenLifter.java
          # Binary Ninja is licensed and cannot be installed here, so nothing
          # on a runner can run this script. Parsing it is what is left, and
          # it catches the failure that would otherwise reach a user as
          # Binary Ninja exiting non-zero with a traceback.
          python3 -m py_compile assets/lifters/binaryninja/scripts/BnilLifter.py
          python3 -m py_compile assets/lifters/ida/scripts/MicrocodeLifter.py

      - name: build
        shell: bash
        run: |
          cargo fmt --all -- --check
          # Both configurations get compiled. The release binary carries the
          # MCP server, so clippy is run with the feature; `cargo build` is
          # left on the default features, because everything under `mcp` is
          # behind `#[cfg]` and a wrong one would otherwise only show up in a
          # build nobody runs.
          cargo clippy --all-targets --features mcp -- -D warnings
          cargo build --release
          # The library on its own, which is what `cargo add oinkie
          # --no-default-features` builds. Nothing else here would notice it
          # breaking: `cli` is a default feature, so the first person to find
          # out would be a stranger.
          cargo build --no-default-features --lib
      # TEMPORARY, for #126. Remove once that is decided.
      #
      # The macOS runner lifts testdata/bin/udl to zero functions and ubuntu
      # finds the function in it, from the same committed bytes and the same
      # pinned Ghidra. Nothing in a normal run says why: `Headless` surfaces
      # Ghidra's stdout only when the process fails or the output file is
      # missing, and on that runner neither happened -- a file was written and
      # it parsed. So this runs analyzeHeadless the way `lift` does and keeps
      # what it said, on both Unix runners, to be compared rather than guessed
      # at.
      #
      # Every command is allowed to fail: this step reports, and the `test`
      # step below is what passes or does not.
      - name: "Diagnose the udl lift (#126)"
        if: matrix.os != 'windows-latest'
        shell: bash
        env:
          GHIDRA_HOME: ${{ env.GHIDRA_INSTALL_DIR }}
        run: |
          echo "::group::runner and fixture"
          echo "os=${{ matrix.os }} arch=$(uname -m)"
          grep -E '^application.(version|release.name)=' \
            "$GHIDRA_HOME/Ghidra/application.properties" || true
          file testdata/bin/udl || true
          shasum -a 256 testdata/bin/udl || sha256sum testdata/bin/udl || true
          echo "::endgroup::"

          echo "::group::oinkie lift"
          ./target/release/oinkie -l debug lift -d "$RUNNER_TEMP/lifted" \
            testdata/bin/udl 2>&1 | tail -40 || true
          python3 - "$RUNNER_TEMP/lifted/udl.json" <<'PY' || true
          import json, sys, pathlib
          p = pathlib.Path(sys.argv[1])
          if not p.exists():
              print("no output file at", p)
              raise SystemExit(0)
          d = json.loads(p.read_text())
          print("ir:", d.get("ir"), " program:", d.get("program"))
          print("functions:", len(d.get("functions", [])),
                " symbols:", len(d.get("symbols", {})))
          for f in d.get("functions", [])[:25]:
              print("  fn", repr(f.get("name")), "ops:", len(f.get("ops", [])))
          PY
          echo "::endgroup::"

          # The same invocation `lift` builds, with Ghidra's own account of it
          # kept this time. src/ghidra/lifter.rs is the argv being mirrored.
          echo "::group::analyzeHeadless, directly"
          mkdir -p "$RUNNER_TEMP/proj" "$RUNNER_TEMP/scripts"
          cp assets/lifters/ghidra/scripts/HighPCodeLifter.java "$RUNNER_TEMP/scripts/"
          ( cd "$RUNNER_TEMP/proj" \
            && "$GHIDRA_HOME/support/analyzeHeadless" "$RUNNER_TEMP/proj" udl \
                 -import "$GITHUB_WORKSPACE/testdata/bin/udl" \
                 -scriptPath "$RUNNER_TEMP/scripts" \
                 -postScript HighPCodeLifter.java 2>&1 ) | tail -80 || true
          echo "analyzeHeadless exit=${PIPESTATUS[0]}"
          ls -l "$RUNNER_TEMP/proj" || true
          echo "::endgroup::"

      # Unix runners have Ghidra, and the tests that start it need to be told
      # where: the action exports GHIDRA_INSTALL_DIR, and oinkie reads
      # GHIDRA_HOME. The coverage step below already does this, which is why
      # nothing noticed -- it was the only place tests ran.
      #
      # Windows has no Ghidra, so the whole serial(ghidra) group is skipped by
      # the file it lives in. Skipping by test name was tried and is wrong:
      # `--skip test_lift` misses
      # `test_a_lift_whose_output_cannot_be_read_is_not_a_successful_lift`,
      # which starts a Ghidra like the rest.
      - name: test
        shell: bash
        env:
          GHIDRA_HOME: ${{ env.GHIDRA_INSTALL_DIR }}
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cargo test --features mcp --lib --bins
            cargo test --features mcp --test lib_test --test mcp_test \
              --test binaryninja_test --test ida_test --test package_test
          else
            cargo test --features mcp
          fi

      - name: Convert coverage format to lcov
        if: matrix.os == 'ubuntu-latest'
        run: |
          export GHIDRA_HOME=${{ env.GHIDRA_INSTALL_DIR }}
          cargo install cargo-llvm-cov
          rustup component add llvm-tools-preview
          # --features mcp, or cli/mcp/ is invisible to the report the way
          # cli/gencomp.rs already is: behind a feature, and so never compiled
          # by a coverage run using the default ones.
          cargo llvm-cov --features mcp --lcov --output-path coverage.lcov

      - name: coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.github_token }}
          path-to-lcov: coverage.lcov
        if: matrix.os == 'ubuntu-latest'
